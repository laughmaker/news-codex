<main><header><button class="brand" id="home" type="button" aria-label="Home"><svg class="news-logo" width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="9" fill="currentColor"/><path d="M9 23V9h3l8 10V9h3v14h-3L12 13v10H9Z" fill="var(--bg)"/><circle cx="25" cy="7" r="2" fill="var(--bg)"/></svg>news<span>.</span><small>PERSONAL INTELLIGENCE</small></button><input id="search" aria-label="Search news" placeholder="Search the archive"><button id="saved" type="button">Saved</button><button id="theme" type="button" aria-label="Theme: System. Switch to light." title="System theme"></button></header><div class="layout"><nav aria-label="News editions"><p id="nav-title">Latest 5 editions</p><div id="list"></div><button id="history">Load more</button></nav><article><div id="edition" class="eyebrow">DAILY BRIEF</div><h2 id="title">Select an edition</h2><div class="toolbar"><p id="status" role="status">Loading…</p><button id="save" type="button" aria-pressed="false">Save edition</button></div><p class="archive-note">Archived edition · News and popularity reflect the original publication.</p><div id="content"></div><div id="links"></div></article></div></main>
<!-- markdown-renderer -->
<script>
let news=[],selected=null,viewMode='recent',visibleCount=5;const $=id=>document.getElementById(id);let state={};try{state=JSON.parse(localStorage.getItem('news-state')||'{}')}catch{};
let currentTheme='auto';
const themeIcons={auto:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/>',light:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',dark:'<path d="M20.9 13a9 9 0 0 1-9.9-9.9A9 9 0 1 0 20.9 13Z"/>'};
function applyTheme(value){if(!['auto','light','dark'].includes(value))value='auto';currentTheme=value;document.documentElement.dataset.theme=value;const next={auto:'light',light:'dark',dark:'auto'}[value];const name=value==='auto'?'System':value==='light'?'Light':'Dark';$('theme').innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+themeIcons[value]+'</svg>';$('theme').setAttribute('aria-label','Theme: '+name+'. Switch to '+(next==='auto'?'system':next)+'.');$('theme').title=name+' theme';try{localStorage.setItem('news-theme',value)}catch{}}
let initialTheme='auto';try{initialTheme=localStorage.getItem('news-theme')||'auto'}catch{}applyTheme(initialTheme);$('theme').onclick=()=>applyTheme({auto:'light',light:'dark',dark:'auto'}[currentTheme]);
function persist(){try{localStorage.setItem('news-state',JSON.stringify(state))}catch{$('status').textContent='This host cannot save preferences. You can continue reading.'}}
function listTitle(title){return title.replace(/[（(]\s*\d{4}[-/.]\d{2}[-/.]\d{2}\s*[）)]/g,'').replace(/\d{4}[-/.]\d{2}[-/.]\d{2}|\b\d{8}\b/g,'').replace(/\s*[-—–·:]\s*$/,'').trim();}
function render(){const q=$('search').value.trim().toLowerCase();$('list').replaceChildren();const matches=news.filter(n=>(viewMode!=='saved'||state[n.id]?.saved)&&(n.title+n.markdown).toLowerCase().includes(q));const items=viewMode==='saved'||q?matches:matches.slice(0,visibleCount);$('nav-title').textContent=viewMode==='saved'?(q?'Search saved editions':'Saved editions'):q?'Search results':`Latest ${items.length} editions`;$('history').textContent='Load more';$('history').hidden=viewMode==='saved'||Boolean(q)||visibleCount>=matches.length;$('saved').textContent=`Saved (${news.filter(n=>state[n.id]?.saved).length})`;$('saved').setAttribute('aria-pressed',String(viewMode==='saved'));for(const n of items){let b=document.createElement('button');b.dataset.id=n.id;b.setAttribute('aria-current',String(n.id===selected?.id));const meta=document.createElement('span');meta.className='edition-meta';const date=document.createElement('span');date.textContent=`${state[n.id]?.saved?'★ ':''}${n.date}`;const kind=document.createElement('span');kind.className='edition-kind';kind.textContent=/github/i.test(n.id+n.title)?'GitHub':'HN';meta.append(date,kind);const label=document.createElement('span');label.className='edition-title';label.textContent=listTitle(n.title);b.append(meta,label);b.onclick=()=>{show(n);render();document.querySelector('article').scrollTop=0};$('list').append(b)}$('status').textContent=items.length?`${/github/i.test(selected?.id+selected?.title)?'GitHub':'Hacker News'} · ${selected?.date||''}`:viewMode==='saved'?'No saved editions match this view. Save an edition to see it here.':'No matching editions';}
$('home').onclick=()=>{viewMode='recent';visibleCount=5;$('search').value='';if(news.length)show(news[0]);render();document.querySelector('article').scrollTop=0;document.querySelector('nav').scrollTop=0};
$('history').onclick=()=>{visibleCount+=5;render()};
$('saved').onclick=()=>{viewMode=viewMode==='saved'?'recent':'saved';$('search').value='';render()};
function updateSave(n){const saved=Boolean(state[n.id]?.saved);$('save').setAttribute('aria-pressed',String(saved));$('save').setAttribute('aria-label',saved?'Remove saved edition':'Save edition');$('save').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4Z"/></svg><span>'+(saved?'Saved':'Save')+'</span>'}
function polishContent(){const content=$('content');const first=content.querySelector('h1');if(first&&first===content.firstElementChild)first.remove();const quote=content.querySelector(':scope > blockquote');if(quote&&!quote.previousElementSibling){const details=document.createElement('details');details.className='methodology';const summary=document.createElement('summary');summary.textContent='Sources & methodology';quote.before(details);details.append(summary,quote)}for(const heading of content.querySelectorAll('h2')){const match=heading.textContent.match(/\s*[—–]\s*([\d,]+)\s*(stars|points)[，,、\s]+([\d,]+)\s*(forks|comments)\s*$/i);if(!match)continue;const walker=document.createTreeWalker(heading,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){node.textContent=node.textContent.replace(match[0],'')}const metrics=document.createElement('p');metrics.className='project-metrics';metrics.textContent=(match[2].toLowerCase()==='stars'?'★ ':'')+match[1]+' '+match[2]+' · '+match[3]+' '+match[4];heading.after(metrics)}}
function show(n){selected=n;$('edition').textContent='DAILY BRIEF / '+n.date.replaceAll('-','.');$('title').textContent=listTitle(n.title);$('content').innerHTML=DOMPurify.sanitize(marked.parse(n.markdown),{USE_PROFILES:{html:true},FORBID_TAGS:['style','form','input','button','iframe'],FORBID_ATTR:['style']});$('content').querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'});$('content').querySelectorAll('img').forEach(img=>img.remove());polishContent();updateSave(n);$('links').replaceChildren();for(const url of n.sources){try{const u=new URL(url);if(!['https:','http:'].includes(u.protocol))continue;let a=document.createElement('a');a.href=u.href;a.textContent=u.hostname+' · Original source';a.target='_blank';a.rel='noopener noreferrer';$('links').append(a)}catch{}}}
$('save').onclick=()=>{if(!selected)return;state[selected.id]??={};state[selected.id].saved=!state[selected.id].saved;persist();render();show(selected)};
$('search').oninput=render;
let serial=0;const pending=new Map();function rpc(method,params){return new Promise((resolve,reject)=>{let id=++serial;const timer=setTimeout(()=>{pending.delete(id);reject(Error('Host connection timed out'))},10000);pending.set(id,{resolve,reject,timer});parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
function accept(r){if(r?.structuredContent?.news){news=[...r.structuredContent.news].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));if(news.length)show(news.find(n=>n.id===selected?.id)||news[0]);render();}}
window.addEventListener('message',e=>{if(e.source!==parent||e.data?.jsonrpc!=='2.0')return;const m=e.data,p=pending.get(m.id);if(p){clearTimeout(p.timer);pending.delete(m.id);m.error?p.reject(Error(m.error.message)):p.resolve(m.result)}else if(m.method==='ui/notifications/tool-result')accept(m.params)});
async function load(){try{if(parent===window){accept(await(await fetch('/api/news')).json());return;}accept(await rpc('tools/call',{name:'list_news',arguments:{}}))}catch(e){$('status').textContent=e.message+'. Please open in a host supporting MCP Apps.'}}

(async()=>{try{if(parent!==window){await rpc('ui/initialize',{appInfo:{name:'news-reader',version:'0.2.2'},appCapabilities:{},protocolVersion:'2026-01-26'});parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*')}await load()}catch(e){$('status').textContent=e.message}})();
